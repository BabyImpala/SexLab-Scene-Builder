<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Stage</title>
  <script>
    (function () {
      var dark = false;
      try {
        var stored = localStorage.getItem('slsb-darkmode');
        if (stored === '1' || stored === '0') {
          dark = stored === '1';
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
      } catch (e) {}
      window.__SLSB_DARK__ = dark;
      document.documentElement.style.background = dark ? '#141414' : '#f5f5f5';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
</head>

<body style="margin:0">
  <div id="root"></div>
  <script>
    (function () {
      var root = document.getElementById('root');
      if (root) root.className = window.__SLSB_DARK__ ? 'dark-mode' : 'light-mode';
    })();
  </script>
  <script type="module" src="/src/stage.jsx"></script>
</body>

</html>
